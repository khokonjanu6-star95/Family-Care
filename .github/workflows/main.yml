name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Re-create Fresh App Structure
      run: |
        mkdir temp_app
        cd temp_app
        flutter create family_care --org com.familycare.app
        cp -r family_care/android ../
        cd ..
        rm -rf temp_app

    - name: Get dependencies
      run: flutter pub get
      
    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: family-care-apk
        path: build/app/outputs/flutter-apk/app-release.apk
