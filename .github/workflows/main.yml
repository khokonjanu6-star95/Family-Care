name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Auto Create Complete Flutter Structure
      run: |
        # ১. ব্যাকগ্রাউন্ডে নতুন কমপ্লিট প্রজেক্ট তৈরি
        flutter create temp_app --org com.familycare.app
        
        # ২. প্রয়োজনীয় অ্যান্ড্রয়েড ফাইল মূল ফোল্ডারে আনা
        cp -r temp_app/android ./
        
        # ৩. অস্থায়ী ফোল্ডার মুছে ফেলা
        rm -rf temp_app

    - name: Get dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: family-care-apk
        path: build/app/outputs/flutter-apk/app-release.apk
